name: CI

# Full suite (build + test + smoke) on every push to main and on pull
# requests. The smoke and tests start their own brokers on hermetic tmp
# dirs and self-manage MESH_NO_AUTO_BROKER, so a bare runner needs no
# mesh and no extra services.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run smoke
